# Optional: Codespace-specific Docker Compose for running MCP server in a container
# Run with: docker-compose -f .devcontainer/docker-compose.yml up

version: "3.8"

services:
  awesome-copilot-mcp:
    build:
      context: ../
      dockerfile: Dockerfile.awesome-copilot
    container_name: awesome-copilot-mcp
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    command: --http
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
