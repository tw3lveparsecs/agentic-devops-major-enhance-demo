# This workflow deploys the Bicep template to Azure using OIDC federated credentials (no secrets required)
# Prerequisites:
# - Azure subscription and resource group
# - Azure AD App Registration with Federated Credential for this GitHub repo/branch
# - GitHub secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, REPO_GITHUB_PAT (fine grained to only have access to this repo to read/write secrets and environments)
# - Contributor role assigned to the App Registration on the target resource group

name: Deploy Static Web App Infrastructure

on:
  workflow_dispatch:
    inputs:
      resource-group:
        description: "Azure Resource Group name"
        required: true
        type: string
      environment:
        description: "GitHub Environment name"
        required: true
        type: string
        default: "demo"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Deploy Bicep file
        uses: azure/bicep-deploy@v2
        id: deploy
        with:
          type: deployment
          operation: create
          name: static-web-app-deploy
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ inputs.resource-group }}
          template-file: ./infrastructure/main.bicep
          parameters-file: ./infrastructure/main.bicepparam

      - name: Authenticate GitHub CLI
        run: gh auth login --with-token <<< ${{ secrets.REPO_GITHUB_PAT }}

      - name: Get Static Web App Deployment Token
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            STATIC_WEB_APP_NAME="${{ steps.deploy.outputs.staticWebAppName }}"
            AZURE_STATIC_WEB_APPS_API_TOKEN=$(az staticwebapp secrets list \
              --name $STATIC_WEB_APP_NAME \
              --query 'properties.apiKey' \
              --output tsv)

            # Mask the token so it doesn't appear in logs
            echo "::add-mask::$AZURE_STATIC_WEB_APPS_API_TOKEN"
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$AZURE_STATIC_WEB_APPS_API_TOKEN" >> $GITHUB_ENV

      - name: Set Static Web App Deploy Token as GitHub Secret
        run: |
          echo "Setting AZURE_STATIC_WEB_APPS_API_TOKEN as a repository secret"
          echo "${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}" | gh secret set --env ${{ inputs.environment }} AZURE_STATIC_WEB_APPS_API_TOKEN
        shell: bash
