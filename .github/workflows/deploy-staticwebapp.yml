# This workflow builds and deploys the React app to Azure Static Web Apps
# It uses OIDC for Azure authentication and expects the Static Web App to already exist (provisioned by Bicep)
# Prerequisites:
# - Azure Static Web App resource created (by IaC)
# - OIDC federated credentials set up for this repo/branch
# - GitHub secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

name: Build and Deploy React App to Azure Static Web Apps

on:
  workflow_dispatch:
    inputs:
      resource-group:
        description: "Azure Resource Group name"
        required: true
        type: string
      static-webapp-name:
        description: "Azure Static Web App name"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: demo
    outputs:
      artifact-name: ${{ steps.upload-artifact.outputs.artifact-name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: demo
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Azure Login (OIDC)
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Deploy to Azure Static Web Apps (OIDC, no API token)
        run: |
          az extension add --name webapp --yes || true
          az staticwebapp upload \
            --name ${{ inputs.static-webapp-name }} \
            --resource-group ${{ inputs.resource-group }} \
            --source dist
