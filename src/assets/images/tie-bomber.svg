<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cockpit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </radialGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#333"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>
  
  <!-- Left Wing Panel -->
  <rect x="50" y="50" width="80" height="200" fill="url(#wing)" stroke="#444" stroke-width="2"/>
  <rect x="60" y="60" width="60" height="180" fill="#222" stroke="#555" stroke-width="1"/>
  
  <!-- Right Wing Panel -->
  <rect x="270" y="50" width="80" height="200" fill="url(#wing)" stroke="#444" stroke-width="2"/>
  <rect x="280" y="60" width="60" height="180" fill="#222" stroke="#555" stroke-width="1"/>
  
  <!-- Central Hull -->
  <rect x="170" y="120" width="60" height="60" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  
  <!-- Cockpit Sphere -->
  <circle cx="200" cy="150" r="25" fill="url(#cockpit)" stroke="#666" stroke-width="2"/>
  <circle cx="200" cy="150" r="15" fill="#1a1a1a" stroke="#888" stroke-width="1"/>
  
  <!-- Bomb Bay Pod -->
  <rect x="185" y="185" width="30" height="40" fill="#333" stroke="#666" stroke-width="2" rx="5"/>
  <rect x="190" y="190" width="20" height="30" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  
  <!-- Engine Glow -->
  <circle cx="200" cy="240" r="8" fill="#dc2626" opacity="0.8"/>
  <circle cx="200" cy="240" r="4" fill="#ef4444"/>
  
  <!-- Wing Details -->
  <line x1="90" y1="70" x2="90" y2="230" stroke="#666" stroke-width="1"/>
  <line x1="310" y1="70" x2="310" y2="230" stroke="#666" stroke-width="1"/>
  
  <!-- Wing Support Struts -->
  <line x1="130" y1="130" x2="170" y2="140" stroke="#555" stroke-width="3"/>
  <line x1="130" y1="170" x2="170" y2="160" stroke="#555" stroke-width="3"/>
  <line x1="270" y1="130" x2="230" y2="140" stroke="#555" stroke-width="3"/>
  <line x1="270" y1="170" x2="230" y2="160" stroke="#555" stroke-width="3"/>
  
  <!-- Bomb Bay Details -->
  <circle cx="195" cy="200" r="2" fill="#dc2626"/>
  <circle cx="205" cy="200" r="2" fill="#dc2626"/>
  <circle cx="195" cy="210" r="2" fill="#dc2626"/>
  <circle cx="205" cy="210" r="2" fill="#dc2626"/>
</svg>