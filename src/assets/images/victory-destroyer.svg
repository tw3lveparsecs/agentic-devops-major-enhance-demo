<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="50%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  
  <!-- Main Hull - More rounded than Imperial-class -->
  <polygon points="70,150 330,130 340,140 340,160 330,170 70,150" fill="url(#hull)" stroke="#555" stroke-width="2"/>
  
  <!-- Upper Hull Detail -->
  <polygon points="80,145 320,135 320,145 80,150" fill="#333" stroke="#666" stroke-width="1"/>
  
  <!-- Lower Hull Detail -->
  <polygon points="80,150 320,155 320,165 80,155" fill="#333" stroke="#666" stroke-width="1"/>
  
  <!-- Bridge Tower -->
  <rect x="120" y="135" width="30" height="15" fill="url(#bridge)" stroke="#555" stroke-width="2"/>
  <rect x="125" y="130" width="20" height="8" fill="#333" stroke="#666" stroke-width="1"/>
  
  <!-- Command Bridge -->
  <rect x="130" y="125" width="10" height="6" fill="#2a2a2a" stroke="#777" stroke-width="1"/>
  <rect x="132" y="122" width="6" height="4" fill="#1a1a1a" stroke="#888" stroke-width="1"/>
  
  <!-- Engine Section -->
  <rect x="65" y="145" width="12" height="10" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  
  <!-- Engine Glows -->
  <circle cx="67" cy="147" r="2" fill="#3b82f6" opacity="0.8"/>
  <circle cx="67" cy="147" r="1" fill="#60a5fa"/>
  <circle cx="67" cy="150" r="2" fill="#3b82f6" opacity="0.8"/>
  <circle cx="67" cy="150" r="1" fill="#60a5fa"/>
  <circle cx="67" cy="153" r="2" fill="#3b82f6" opacity="0.8"/>
  <circle cx="67" cy="153" r="1" fill="#60a5fa"/>
  
  <!-- Hull Details -->
  <line x1="90" y1="147" x2="310" y2="137" stroke="#666" stroke-width="1"/>
  <line x1="90" y1="153" x2="310" y2="163" stroke="#666" stroke-width="1"/>
  
  <!-- Weapon Turrets -->
  <circle cx="160" cy="142" r="2.5" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="200" cy="140" r="2.5" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="240" cy="138" r="2.5" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="280" cy="136" r="2.5" fill="#444" stroke="#666" stroke-width="1"/>
  
  <circle cx="160" cy="158" r="2.5" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="200" cy="160" r="2.5" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="240" cy="162" r="2.5" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="280" cy="164" r="2.5" fill="#444" stroke="#666" stroke-width="1"/>
  
  <!-- Communications Array -->
  <line x1="135" y1="125" x2="135" y2="115" stroke="#666" stroke-width="1"/>
  <circle cx="135" cy="112" r="2" fill="#dc2626"/>
  
  <!-- Hull Plating Lines -->
  <line x1="85" y1="148" x2="315" y2="138" stroke="#555" stroke-width="0.5"/>
  <line x1="85" y1="152" x2="315" y2="162" stroke="#555" stroke-width="0.5"/>
  
  <!-- Docking Bay -->
  <rect x="180" y="147" width="30" height="6" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  
  <!-- Side Weapon Batteries -->
  <rect x="160" y="135" width="8" height="3" fill="#444" stroke="#666" stroke-width="1"/>
  <rect x="240" y="133" width="8" height="3" fill="#444" stroke="#666" stroke-width="1"/>
  <rect x="160" y="162" width="8" height="3" fill="#444" stroke="#666" stroke-width="1"/>
  <rect x="240" y="164" width="8" height="3" fill="#444" stroke="#666" stroke-width="1"/>
</svg>