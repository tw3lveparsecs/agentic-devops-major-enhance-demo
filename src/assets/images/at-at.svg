<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="50%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="leg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  
  <!-- Main Body -->
  <rect x="150" y="80" width="120" height="60" fill="url(#body)" stroke="#555" stroke-width="2" rx="5"/>
  
  <!-- Head/Command Module -->
  <rect x="270" y="90" width="40" height="40" fill="url(#body)" stroke="#555" stroke-width="2" rx="3"/>
  <rect x="280" y="100" width="20" height="20" fill="#2a2a2a" stroke="#666" stroke-width="1"/>
  
  <!-- Front Legs -->
  <rect x="280" y="140" width="12" height="80" fill="url(#leg)" stroke="#444" stroke-width="2"/>
  <rect x="300" y="140" width="12" height="80" fill="url(#leg)" stroke="#444" stroke-width="2"/>
  
  <!-- Rear Legs -->
  <rect x="160" y="140" width="12" height="80" fill="url(#leg)" stroke="#444" stroke-width="2"/>
  <rect x="180" y="140" width="12" height="80" fill="url(#leg)" stroke="#444" stroke-width="2"/>
  
  <!-- Leg Joints -->
  <circle cx="286" cy="140" r="8" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="306" cy="140" r="8" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="166" cy="140" r="8" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="186" cy="140" r="8" fill="#333" stroke="#555" stroke-width="2"/>
  
  <!-- Feet -->
  <ellipse cx="286" cy="225" rx="15" ry="8" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  <ellipse cx="306" cy="225" rx="15" ry="8" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  <ellipse cx="166" cy="225" rx="15" ry="8" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  <ellipse cx="186" cy="225" rx="15" ry="8" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  
  <!-- Weapons -->
  <rect x="310" y="105" width="15" height="6" fill="#444" stroke="#666" stroke-width="1"/>
  <rect x="310" y="115" width="15" height="6" fill="#444" stroke="#666" stroke-width="1"/>
  
  <!-- Body Details -->
  <line x1="160" y1="100" x2="260" y2="100" stroke="#666" stroke-width="1"/>
  <line x1="160" y1="120" x2="260" y2="120" stroke="#666" stroke-width="1"/>
  <rect x="170" y="90" width="8" height="8" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="190" y="90" width="8" height="8" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="220" y="90" width="8" height="8" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="240" y="90" width="8" height="8" fill="#333" stroke="#555" stroke-width="1"/>
  
  <!-- Engine Glow -->
  <circle cx="150" cy="110" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="150" cy="110" r="2" fill="#60a5fa"/>
</svg>