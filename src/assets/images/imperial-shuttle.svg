<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="50%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="50%" style="stop-color:#333"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  
  <!-- Main Hull -->
  <polygon points="120,150 280,120 320,140 320,160 280,180 120,150" fill="url(#hull)" stroke="#555" stroke-width="2"/>
  
  <!-- Upper Wing -->
  <polygon points="150,80 250,60 280,70 320,80 320,120 280,120 250,100 150,120" fill="url(#wing)" stroke="#444" stroke-width="2"/>
  
  <!-- Lower Wing -->
  <polygon points="150,180 250,200 280,180 320,180 320,220 280,210 250,240 150,220" fill="url(#wing)" stroke="#444" stroke-width="2"/>
  
  <!-- Cockpit Section -->
  <polygon points="280,120 320,140 350,150 320,160 280,180" fill="#4a4a4a" stroke="#666" stroke-width="2"/>
  <polygon points="300,135 340,150 300,165" fill="#2a2a2a" stroke="#777" stroke-width="1"/>
  
  <!-- Wing Details -->
  <line x1="180" y1="90" x2="280" y2="80" stroke="#666" stroke-width="1"/>
  <line x1="180" y1="100" x2="280" y2="90" stroke="#555" stroke-width="1"/>
  <line x1="180" y1="200" x2="280" y2="190" stroke="#666" stroke-width="1"/>
  <line x1="180" y1="210" x2="280" y2="200" stroke="#555" stroke-width="1"/>
  
  <!-- Engine Glows -->
  <circle cx="125" cy="145" r="6" fill="#3b82f6" opacity="0.8"/>
  <circle cx="125" cy="145" r="3" fill="#60a5fa"/>
  <circle cx="125" cy="155" r="6" fill="#3b82f6" opacity="0.8"/>
  <circle cx="125" cy="155" r="3" fill="#60a5fa"/>
  
  <!-- Landing Struts -->
  <rect x="200" y="175" width="4" height="15" fill="#555"/>
  <rect x="240" y="175" width="4" height="15" fill="#555"/>
  <circle cx="202" cy="192" r="3" fill="#333"/>
  <circle cx="242" cy="192" r="3" fill="#333"/>
  
  <!-- Hull Details -->
  <line x1="150" y1="145" x2="270" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="150" y1="155" x2="270" y2="170" stroke="#666" stroke-width="1"/>
</svg>