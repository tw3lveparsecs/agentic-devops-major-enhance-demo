<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="50%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  
  <!-- Main Hull - Triangular -->
  <polygon points="50,150 350,120 350,180 50,150" fill="url(#hull)" stroke="#555" stroke-width="2"/>
  
  <!-- Upper Hull Detail -->
  <polygon points="60,145 340,125 340,140 60,150" fill="#333" stroke="#666" stroke-width="1"/>
  
  <!-- Lower Hull Detail -->
  <polygon points="60,150 340,160 340,175 60,155" fill="#333" stroke="#666" stroke-width="1"/>
  
  <!-- Bridge Tower -->
  <rect x="100" y="130" width="40" height="20" fill="url(#bridge)" stroke="#555" stroke-width="2"/>
  <rect x="110" y="125" width="20" height="10" fill="#333" stroke="#666" stroke-width="1"/>
  
  <!-- Command Bridge -->
  <rect x="115" y="120" width="10" height="8" fill="#2a2a2a" stroke="#777" stroke-width="1"/>
  <rect x="117" y="117" width="6" height="5" fill="#1a1a1a" stroke="#888" stroke-width="1"/>
  
  <!-- Engine Section -->
  <rect x="45" y="140" width="15" height="20" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  
  <!-- Engine Glows -->
  <circle cx="47" cy="145" r="3" fill="#3b82f6" opacity="0.8"/>
  <circle cx="47" cy="145" r="1.5" fill="#60a5fa"/>
  <circle cx="47" cy="150" r="3" fill="#3b82f6" opacity="0.8"/>
  <circle cx="47" cy="150" r="1.5" fill="#60a5fa"/>
  <circle cx="47" cy="155" r="3" fill="#3b82f6" opacity="0.8"/>
  <circle cx="47" cy="155" r="1.5" fill="#60a5fa"/>
  
  <!-- Hull Details -->
  <line x1="80" y1="147" x2="320" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="80" y1="153" x2="320" y2="170" stroke="#666" stroke-width="1"/>
  
  <!-- Weapon Turrets -->
  <circle cx="150" cy="140" r="3" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="200" cy="135" r="3" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="250" cy="130" r="3" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="300" cy="127" r="3" fill="#444" stroke="#666" stroke-width="1"/>
  
  <circle cx="150" cy="160" r="3" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="200" cy="165" r="3" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="250" cy="170" r="3" fill="#444" stroke="#666" stroke-width="1"/>
  <circle cx="300" cy="173" r="3" fill="#444" stroke="#666" stroke-width="1"/>
  
  <!-- Communications Array -->
  <line x1="120" y1="120" x2="120" y2="105" stroke="#666" stroke-width="1"/>
  <circle cx="120" cy="102" r="2" fill="#dc2626"/>
  
  <!-- Hull Plating Lines -->
  <line x1="70" y1="148" x2="330" y2="132" stroke="#555" stroke-width="0.5"/>
  <line x1="70" y1="152" x2="330" y2="168" stroke="#555" stroke-width="0.5"/>
  
  <!-- Docking Bay -->
  <rect x="180" y="145" width="40" height="10" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
</svg>